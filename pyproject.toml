[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lofop"
version = "0.1.0"
description = "LOFOP: a modular, enterprise-grade computer vision framework."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "LOFOP Contributors" }]
keywords = ["computer-vision", "deep-learning", "object-detection", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "PyYAML>=6.0",
    "pillow>=10.0",
]

[project.scripts]
lofop = "lofop.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
rich = [
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/tedo001/LOFOP"

[project.entry-points."lofop.plugins"]
# Built-in plugins register here as the framework grows.

[tool.setuptools.packages.find]
include = ["lofop*"]

[tool.setuptools.package-data]
lofop = ["csrc/*.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
