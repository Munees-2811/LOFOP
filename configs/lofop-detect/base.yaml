# Shared settings for the LOFOP-Detect family. Size variants extend this file
# and override widths/depths only -- the architecture is identical.
num_classes: 80

model:
  type: model/LofopDetect
  score_threshold: 0.05
  nms_iou: 0.6
  max_detections: 300
  backbone:
    type: backbone/RidgeNet
    expansion: 2.0
  neck:
    type: neck/DeltaFusion
  head:
    type: head/ApexHead
    num_classes: ${num_classes}
    strides: [8, 16, 32]
    num_convs: 2
